
name: Upload Assets

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0

      - name: Validate and build
        run: |
          yarn install --immutable
          caps --strict --ci
          caps verify --toolchain
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry test --check-only
          calcit calcit.cirru --entry cli --check-only
          calcit calcit.cirru analyze dynamic-methods
          calcit calcit.cirru --entry test analyze dynamic-methods
          calcit calcit.cirru --entry cli analyze dynamic-methods
          calcit calcit.cirru analyze deprecated --summary-only
          calcit calcit.cirru --entry test analyze deprecated --summary-only
          calcit calcit.cirru --entry cli analyze deprecated --summary-only
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
          calcit calcit.cirru --entry test js
          node test.mjs
          calcit calcit.cirru --entry cli js
          node cli.mjs tests/fibo.cirru
          calcit calcit.cirru js
          yarn vite build --base=./

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: '-avzr --progress'
          options: ''
          ssh_options: ''
          src: 'dist/*'
          dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
