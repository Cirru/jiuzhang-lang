
name: npm publish

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0

      - name: Validate and build CLI
        run: |
          yarn install --immutable
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru --entry test --check-only
          calcit calcit.cirru --entry cli --check-only
          calcit calcit.cirru --entry test analyze dynamic-methods --max 0
          calcit calcit.cirru --entry cli analyze dynamic-methods --max 0
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
          calcit calcit.cirru --entry test js
          node test.mjs
          calcit calcit.cirru --entry cli js

      - name: publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
