name: Temporary public-method preparation
on:
  push:
    branches: [prepare/public-methods-031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Resolve unchanged formal dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn install --immutable
          caps --strict --ci
          caps verify --toolchain
      - name: Apply reviewed public-method transaction
        run: node apply-reviewed.mjs
      - name: Run original three-entry gates and examples
        run: |
          set -euo pipefail
          prepared_blob=$(git hash-object calcit.cirru)
          calcit edit format
          test "$prepared_blob" = "$(git hash-object calcit.cirru)"
          calcit --check-only --ns 'app.$meta' --ns app.config --ns app.schema --ns app.updater --ns app.comp.container --ns app.main
          calcit --entry cli --check-only --ns app.cli --ns app.program --ns app.counting
          calcit --entry test --check-only --ns app.test --ns app.program
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit --entry cli fix --workflow strict --verify --format json | tee acceptance/strict-cli.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit --entry test fix --workflow strict --verify --format json | tee acceptance/strict-test.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit --entry test analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit --entry cli analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit analyze weak-types --only deprecated-call --format json | jq -e '.data.summary.calls == 0'
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru | tee acceptance/quality.txt
          calcit calcit.cirru --entry test js
          node test.mjs
          calcit calcit.cirru --entry cli js
          node cli.mjs tests/fibo.cirru
          npm pack --dry-run --ignore-scripts --json | jq -e '.[0].files | any(.path == "cli.mjs") and any(.path == "js-out/app.cli.mjs") and all(.path | startswith(".calcit/") | not)'
          calcit calcit.cirru js
          yarn release-page
      - name: Retain preparation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: public-method-preparation
          path: |
            acceptance/
            calcit.cirru
            js-out/
            dist/
          if-no-files-found: error
          retention-days: 7
